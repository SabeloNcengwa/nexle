name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build shared
        run: npm run build -w @mavundla/shared
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Validate prod-env script (non-production skip)
        run: npm run validate:prod-env
      - name: Firestore rules tests
        run: npx firebase emulators:exec --only firestore "npm run test:rules -w @mavundla/api"
